[project]
name = "hand-clean-station"
version = "0.1.0"
description = "HandCleanStation backend: camera, AI and UV control"
requires-python = "==3.11.15"
dependencies = [
    "fastapi==0.162.0",
    "gpiozero==2.0.1.post3",
    "lgpio==0.2.2.0 ; sys_platform == 'linux'",
    "linuxpy==0.25.0 ; sys_platform == 'linux'",
    "numpy==2.4.6",
    "onnxruntime==1.31.1",
    "simplejpeg==1.9.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
