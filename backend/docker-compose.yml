# Dev (Windows): arm64 emulated via QEMU, mock GPIO, fake camera frames.
# Pi:            docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d
services:
  backend:
    build: .
    image: hand-clean-station-backend:0.1.0
    platform: linux/arm64
    ports:
      - "8000:8000"
    environment:
      GPIOZERO_PIN_FACTORY: mock
      CAMERA_SOURCE: fake
    volumes:
      - ./config:/app/config  # folder, not the file: os.replace cannot swap a single-file bind mount (EBUSY)
      - ./models:/app/models
    restart: always
